name: Build candidate installers

on:
  workflow_dispatch:
    inputs:
      with_electron:
        description: 兼容旧调用参数；安装包始终包含 Electron
        type: boolean
        default: true
  push:
    branches: [windows, mac]

permissions:
  contents: read

concurrency:
  group: candidate-installers-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build installers]')
    name: Candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
          - target: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Prepare locked frontend dependencies
        working-directory: desktop
        run: npm ci && npx install-electron --no && npm run build
      - name: Verify source and build host
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python - <<'PY'
          import os, platform, subprocess, sys
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert sha == os.environ['CANDIDATE_SHA'], 'Source commit mismatch'
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip(), 'Modified checkout'
          expected = ('darwin', 'arm64') if os.environ['CANDIDATE_TARGET'] == 'macos-arm64' else ('win32', 'amd64')
          assert (sys.platform, platform.machine().lower()) == expected, 'Build host architecture mismatch'
          print('Candidate source:', sha, 'Host:', sys.platform, platform.machine())
          print('Candidate only: no Release, update-feed publication or production signing.')
          PY
      - name: Install build and test tools
        run: python -m pip install -e ".[dev,legacy-qt]" 'zstandard==0.25.0'
      - name: No-audio regression
        run: python scripts/test_no_audio.py -q -rs --tb=short --junitxml=.work/reports/candidate-tests.xml
      - name: Static checks
        run: python -m ruff check linguaflow scripts tests
      - name: Build Apple Silicon DMG
        if: matrix.target == 'macos-arm64'
        run: |
          python scripts/build_macos.py --fetch --with-electron
          python scripts/build_macos.py --with-electron
      - name: Build Windows payload and installer
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 is missing' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process') }
          }
          if ($LASTEXITCODE) { throw 'MSVC environment setup failed' }
          python scripts/test_no_audio.py -q tests/test_update_recovery.py --tb=short
          if ($LASTEXITCODE) { throw 'Recovery primitives failed' }
          python scripts/build_windows.py --fetch --with-electron
          if ($LASTEXITCODE) { throw 'Windows dependency preparation failed' }
          python -c "import subprocess,sys; from pathlib import Path; from scripts.build_windows import build; from scripts.build_windows_installer import build as seal, prepare_compiler; downloads=Path('.work/packaging/windows-downloads'); compiler=prepare_compiler(downloads); subprocess.run([sys.executable,'scripts/test_no_audio.py','tests/test_windows_installer_paths.py','-q'],check=True); payload=build(downloads,with_electron=True); seal(payload, compiler, downloads, fetch=True)"
          if ($LASTEXITCODE) { throw 'Windows installer build failed' }
      - name: Verify installed Qt-free Electron package without audio
        shell: bash
        run: |
          python - <<'PY'
          import os,subprocess,sys
          from contextlib import contextmanager
          from pathlib import Path
          from scripts.probe_package import run_probe
          from scripts.probe_macos_update import mount
          @contextmanager
          def installed():
              work=Path('.work/packaging/installed-probe').resolve();work.mkdir(parents=True)
              if sys.platform=='darwin':
                  image,=Path('.work/packaging/dist').glob('*.dmg')
                  with mount(image.resolve(),work/'volume') as app: yield app
              else:
                  installer,=Path('.work/packaging/dist').glob('*.exe')
                  app=work/'AgentScribe'
                  subprocess.run([str(installer.resolve()),'/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',f'/DIR={app}'],check=True,timeout=300)
                  run_probe(app)
                  yield app
          with installed() as app:
              resources=app/'Contents/Resources' if sys.platform=='darwin' else app
              python=resources/('python/bin/python3' if sys.platform=='darwin' else 'python/python.exe')
              executable=resources/'desktop/runtime'/('Electron.app/Contents/MacOS/Electron' if sys.platform=='darwin' else 'electron.exe')
              env={**os.environ,'AGENTSCRIBE_PACKAGED':'1','AGENTSCRIBE_RESOURCES':str(resources),
                   'AGENTSCRIBE_DESKTOP_PYTHON':str(python),'AGENTSCRIBE_PROBE_RESOURCES':str(resources),
                   'AGENTSCRIBE_PROBE_ELECTRON':str(executable),'PYTHONDONTWRITEBYTECODE':'1',
                   'AGENTSCRIBE_PROBE_EVIDENCE':str(Path('.work/reports/packaged-electron').resolve())}
              subprocess.run(['node','desktop/scripts/probe.cjs'],env=env,check=True,timeout=180)
          PY
      - name: Upload candidate installer and checksums
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgentScribe-${{ matrix.target }}-${{ github.sha }}
          path: .work/packaging/dist/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-tests-${{ matrix.target }}-${{ github.sha }}
          path: .work/reports/candidate-tests.xml
          if-no-files-found: ignore
          retention-days: 14
