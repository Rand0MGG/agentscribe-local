name: Code checks

on:
  push:
    branches: [windows, mac, main]
  pull_request:
    branches: [windows, mac, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: Electron no-audio desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Isolated Python desktop environment
        run: >-
          python -c "import pathlib, subprocess, sys, venv;
          venv.create('.venv', with_pip=True);
          executable = pathlib.Path('.venv') / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python');
          subprocess.run([str(executable), '-m', 'pip', 'install', '-e', '.[dev]'], check=True)"
      - run: npm ci
        working-directory: desktop
      - run: npx install-electron --no
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run test:chain
        working-directory: desktop
      - run: npm run test:interaction
        working-directory: desktop
      - run: npm run test:audio-adapter
        working-directory: desktop
      - run: .venv/bin/python scripts/test_no_audio.py tests/test_qt_free_backend.py -q
        if: runner.os != 'Windows'
      - run: .venv/Scripts/python.exe scripts/test_no_audio.py tests/test_qt_free_backend.py -q
        if: runner.os == 'Windows'

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9'
      - run: python -m ruff check linguaflow scripts tests

  tests:
    name: No-audio tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,legacy-qt]"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Prepare Electron
        run: npm ci && npx install-electron --no && npm run build
        working-directory: desktop
        env:
          AGENTSCRIBE_DESKTOP_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: python scripts/test_no_audio.py -q -rs

  knowledge:
    name: Optional course SDKs (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGENTSCRIBE_REQUIRE_INTEGRATIONS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,knowledge,legacy-qt]"
      - run: python -c "import deepagents, langchain_deepseek, pypdf"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare Electron
        run: npm ci && npx install-electron --no && npm run build
        working-directory: desktop
        env:
          AGENTSCRIBE_DESKTOP_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: >-
          python scripts/test_no_audio.py tests/test_knowledge.py tests/test_knowledge_api.py
          tests/test_knowledge_adapters.py tests/test_knowledge_worker.py tests/test_knowledge_ui.py
          tests/test_architecture.py
          tests/test_knowledge_visual.py::test_real_sdk_image_payload_budget_and_consent
          tests/test_knowledge_visual.py::test_harness_can_recheck_original_page_as_user_image
          tests/test_knowledge_visual.py::test_actual_sdk_harness_page_tool_and_revoked_image_consent -q -rs

  renderer:
    name: Native document rendering (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGENTSCRIBE_REQUIRE_INTEGRATIONS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install -e ".[dev,knowledge,legacy-qt]"
      - name: Prepare Electron
        run: npm ci && npx install-electron --no && npm run build
        working-directory: desktop
        env:
          AGENTSCRIBE_DESKTOP_PYTHON: ${{ steps.python.outputs.python-path }}
      # Install only the rendering dependency; ASR GPU eligibility is unrelated to these tests.
      - run: >-
          python -c "import subprocess, sys;
          from linguaflow.runtime_paths import DOCUMENT_RENDERER_VERSION, runtime_root;
          subprocess.run(['npm.cmd' if sys.platform == 'win32' else 'npm', 'install',
          '--prefix', str(runtime_root() / 'document-renderer'), '--no-audit', '--no-fund',
          '--fetch-timeout=60000', '--fetch-retries=0', '--save-exact',
          '@deepseek-ai/libreoffice-kit@' + DOCUMENT_RENDERER_VERSION], check=True)"
      - run: python -c "import pypdf; from linguaflow.runtime_paths import document_renderer; document_renderer()"
      - run: >-
          python scripts/test_no_audio.py tests/test_knowledge_formats.py
          tests/test_knowledge_visual.py::test_real_offline_renderer_includes_every_page
          tests/test_knowledge_visual.py::test_renderer_cancellation_awaits_disposal -q -rs
