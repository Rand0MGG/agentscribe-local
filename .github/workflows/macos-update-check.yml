name: Verify Mac application update

on:
  push:
    branches: [mac]
    paths: [.github/workflows/macos-update-check.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed candidate tag
        required: true
        type: string
      live:
        description: Use the actual deployed HTTPS feed and unchanged old package
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-update-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify mac update]') || contains(github.event.head_commit.message, '[verify live mac update]')
    runs-on: macos-15
    timeout-minutes: 40
    env:
      UPDATE_TAG: ${{ inputs.tag }}
      UPDATE_LIVE: ${{ inputs.live || contains(github.event.head_commit.message, '[verify live mac update]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select fixed candidate source
        run: |
          python - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          tag=os.environ['UPDATE_TAG'] or 'v'+re.search(r'__version__ = "([^"]+)"',Path('linguaflow/__init__.py').read_text())[1]
          assert re.fullmatch(r'v\d+\.\d+\.\d+',tag)
          sha=subprocess.check_output(['git','rev-parse',tag+'^{commit}'],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('UPDATE_TAG='+tag+'\nUPDATE_SHA='+sha+'\n')
          PY
      - run: python -m pip install -e ".[dev]"
      - name: Download and verify immutable old and new packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];tag=os.environ['UPDATE_TAG']
          releases=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases?per_page=100'],text=True))
          work=Path('.work/update-downloads');work.mkdir(parents=True)
          for selected in ('v0.9.0',tag):
              release,=[r for r in releases if r['tag_name']==selected]
              if os.environ['UPDATE_LIVE']=='true':assert not release['draft']
              stem='AgentScribe-'+selected[1:]+'-macos-arm64'
              suffixes=('.dmg','.build.json') if selected=='v0.9.0' else ('.dmg','.build.json','.dmg.ed25519')
              for suffix in suffixes:
                  name=stem+suffix
                  asset,=[a for a in release['assets'] if a['name']==name and a['state']=='uploaded']
                  subprocess.run(['gh','release','download',selected,'--repo',repo,'--pattern',name,'--dir',str(work)],check=True)
                  data=(work/name).read_bytes()
                  assert len(data)==asset['size'] and 'sha256:'+hashlib.sha256(data).hexdigest()==asset['digest']
              manifest=json.loads((work/(stem+'.build.json')).read_text())
              assert manifest['source_modified'] is False
              assert manifest['dmg_sha256']==hashlib.sha256((work/(stem+'.dmg')).read_bytes()).hexdigest()
              if selected==tag:assert manifest['source_commit']==os.environ['UPDATE_SHA']
          PY
      - name: Native upgrade and recovery acceptance
        run: |
          python - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          stem=Path('.work/update-downloads')/f'AgentScribe-{os.environ["UPDATE_TAG"][1:]}-macos-arm64'
          command=[sys.executable,'scripts/probe_macos_update.py','--old-dmg','.work/update-downloads/AgentScribe-0.9.0-macos-arm64.dmg','--candidate',str(stem)+'.dmg','--manifest',str(stem)+'.build.json','--signature',str(stem)+'.dmg.ed25519','--work','.work/update-acceptance']
          if os.environ['UPDATE_LIVE']=='true':command.append('--live')
          subprocess.run(command,check=True)
          PY
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-update-acceptance-${{ github.run_id }}
          path: |
            .work/update-acceptance/**/result.json
            .work/update-acceptance/**/events.jsonl
            .work/update-acceptance/**/*app.log
            .work/update-acceptance/**/recovery-state.json
          if-no-files-found: ignore
