name: Prepare signed release draft

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 审核后的 main 固定完整提交 SHA
        required: true
        type: string
      tag:
        description: 对应该提交的不可变版本标签
        required: true
        type: string
      target:
        description: 只构建此平台；未验收产物不会发布订阅
        required: true
        type: choice
        options: [macos-arm64, windows-x64]

concurrency:
  group: agentscribe-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.target == 'macos-arm64' && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 60
    environment: release-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify immutable release source
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python - <<'PY'
          import os,re,subprocess
          from linguaflow import __version__
          sha,tag=os.environ['RELEASE_COMMIT'],os.environ['RELEASE_TAG']
          if not re.fullmatch('[0-9a-f]{40}',sha) or tag!='v'+__version__: raise SystemExit('Invalid release identity')
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          if git('rev-parse','HEAD')!=sha or git('rev-parse',tag+'^{commit}')!=sha: raise SystemExit('Tag/commit mismatch')
          subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/main'],check=True)
          if git('status','--porcelain'): raise SystemExit('Source is modified')
          PY
      - name: Verify update signing configuration before build
        env:
          AGENTSCRIBE_UPDATE_PRIVATE_KEY: ${{ secrets[inputs.target == 'macos-arm64' && 'MACOS_UPDATE_PRIVATE_KEY' || 'WINDOWS_UPDATE_PRIVATE_KEY'] }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('AGENTSCRIBE_UPDATE_PRIVATE_KEY'):
            raise SystemExit('release-build 缺少此平台现有的更新签名密钥；请从原钥匙串部署，不能更换已固定的公钥。')
          PY
      - run: python -m pip install -e ".[dev]" 'zstandard==0.25.0'
      - run: python scripts/test_no_audio.py -q --tb=short
      - name: Build Apple Silicon package
        if: inputs.target == 'macos-arm64'
        run: |
          python scripts/build_macos.py --fetch
          python scripts/build_macos.py
      - name: Build complete Windows payload and installer
        if: inputs.target == 'windows-x64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 is missing' }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1],$matches[2],'Process') }
          }
          python scripts/test_no_audio.py -q tests/test_update_recovery.py --tb=short
          if ($LASTEXITCODE) { throw 'Windows recovery primitives failed' }
          python scripts/build_windows.py --fetch
          if ($LASTEXITCODE) { throw 'Windows dependencies failed' }
          python -c "import subprocess,sys;from pathlib import Path;from scripts.build_windows import build;from scripts.build_windows_installer import build as seal,prepare_compiler;downloads=Path('.work/packaging/windows-downloads');compiler=prepare_compiler(downloads);subprocess.run([sys.executable,'scripts/test_no_audio.py','tests/test_windows_installer_paths.py','-q'],check=True);payload=build(downloads);seal(payload,compiler,downloads,fetch=True)"
          if ($LASTEXITCODE) { throw 'Windows package failed' }
      - name: Sign sealed update bytes
        env:
          AGENTSCRIBE_UPDATE_PRIVATE_KEY: ${{ secrets[inputs.target == 'macos-arm64' && 'MACOS_UPDATE_PRIVATE_KEY' || 'WINDOWS_UPDATE_PRIVATE_KEY'] }}
          RELEASE_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.sign_update_artifact import sign
          from linguaflow import __version__
          target=os.environ['RELEASE_TARGET'];suffix='dmg' if target=='macos-arm64' else 'exe'
          stem=Path('.work/packaging/dist')/f'AgentScribe-{__version__}-{target}'
          sign(Path(str(stem)+'.'+suffix),Path(str(stem)+'.build.json'),target,os.environ.pop('AGENTSCRIBE_UPDATE_PRIVATE_KEY',''))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-package
          path: .work/packaging/dist/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: ubuntu-latest
    environment: release-draft
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-package
          path: package
      - name: Create or extend draft without overwriting published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']
          view=subprocess.run(['gh','release','view',tag,'--json','isDraft'],capture_output=True,text=True)
          if view.returncode==0:
            if not json.loads(view.stdout)['isDraft']: raise SystemExit('Published release is immutable')
          else:
            args=['gh','release','create',tag,'--verify-tag','--target',os.environ['RELEASE_COMMIT'],'--draft','--title',tag,'--notes','安装与升级验收完成后发布；未验收平台不推进订阅。']
            if '-beta.' in tag: args.append('--prerelease')
            subprocess.run(args,check=True)
          subprocess.run(['gh','release','upload',tag,*map(str,sorted(Path('package').iterdir()))],check=True)
          PY
