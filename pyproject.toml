[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscribe-local"
version = "0.12.1"
description = "Local live speech recognition and translation for Windows and macOS"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "psutil>=7.2.2,<8",
  "SoundCard>=0.4.3,<0.5", "huggingface-hub>=0.34,<1", "hf_xet>=1.1,<2",
  "pyobjc-framework-ScreenCaptureKit==11.1; sys_platform == 'darwin'",
  "pyobjc-framework-CoreMedia==11.1; sys_platform == 'darwin'",
  "pyobjc-framework-libdispatch==11.1; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa==11.1; sys_platform == 'darwin'",
  "pyobjc-core==11.1; sys_platform == 'darwin'",
]

[project.optional-dependencies]
legacy-qt = ["PySide6>=6.7,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9", "cryptography==50.0.2"]
release = ["cryptography==50.0.2"]
knowledge = ["deepagents==0.7.23", "langchain-deepseek==1.1.1", "pypdf==6.19.0", "keyring==25.7.0"]

[project.scripts]
agentscribe = "linguaflow.desktop_launcher:main"
linguaflow = "linguaflow.desktop_launcher:main"

[tool.setuptools.packages.find]
include = ["linguaflow*"]

[tool.setuptools.package-data]
"linguaflow.knowledge" = ["*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
cache_dir = ".work/cache/pytest"
markers = [
  "p0: safety, privacy, unauthorized costs, or irreversible user data loss",
  "p1: application core workflow and result correctness",
  "p2: independent feature functionality",
  "p3: presentation and interaction convenience",
]

[tool.ruff]
line-length = 110
cache-dir = ".work/cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
